<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GHRP Store & Assistant</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            background-color: #1e293b;
            padding: 1rem 2rem;
            border-bottom: 2px solid #3b82f6;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            color: #3b82f6;
            font-size: 1.5rem;
        }

        .container {
            max-width: 900px;
            margin: 2rem auto;
            padding: 0 1rem;
            width: 100%;
        }

        .chat-card {
            background-color: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .chat-header {
            background-color: #3b82f6;
            padding: 1rem;
            font-weight: bold;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .chat-messages {
            flex: 1;
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .message {
            max-width: 85%;
            padding: 0.8rem 1.2rem;
            border-radius: 12px;
            line-height: 1.5;
            font-size: 0.95rem;
            word-wrap: break-word;
        }

        .bot-message {
            background-color: #334155;
            color: #f8fafc;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }

        .user-message {
            background-color: #2563eb;
            color: #ffffff;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }

        .chat-input-area {
            padding: 1rem;
            background-color: #0f172a;
            display: flex;
            gap: 10px;
            align-items: center;
        }

        textarea {
            flex: 1;
            padding: 0.8rem 1rem;
            border-radius: 8px;
            border: 1px solid #334155;
            background-color: #1e293b;
            color: #fff;
            outline: none;
            resize: none;
            height: 48px;
            font-size: 0.95rem;
        }

        textarea:focus {
            border-color: #3b82f6;
        }

        button {
            padding: 0.8rem 1.5rem;
            background-color: #2563eb;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            height: 48px;
            transition: background 0.2s;
        }

        button:hover {
            background-color: #1d4ed8;
        }

        .quick-questions {
            display: flex;
            gap: 8px;
            padding: 0.5rem 1rem;
            background-color: #1e293b;
            overflow-x: auto;
            border-top: 1px solid #334155;
        }

        .chip {
            background-color: #334155;
            padding: 4px 12px;
            border-radius: 16px;
            font-size: 0.8rem;
            cursor: pointer;
            white-space: nowrap;
        }

        .chip:hover {
            background-color: #3b82f6;
        }
    </style>
</head>
<body>

    <header>
        <h1>GHRP TOKO & ASSISTANT</h1>
        <span>Server Rules AI</span>
    </header>

    <div class="container">
        <div class="chat-card">
            <div class="chat-header">
                🤖 GHRP Rules Bot
            </div>

            <div class="chat-messages" id="chatBox">
                <div class="message bot-message">
                    Halo! Saya AI Bot GHRP. Silakan tanyakan aturan server seputar Rules Ramboing, RDM, VDM, NLR, MetaGaming, atau sistem Toko GHRP.
                </div>
            </div>

            <div class="quick-questions">
                <div class="chip" onclick="askQuick('Rules Ramboing')">📜 Rules Ramboing</div>
                <div class="chip" onclick="askQuick('Batas Membawa Uang')">💵 Batas Uang</div>
                <div class="chip" onclick="askQuick('Apa itu RDM?')">Apa itu RDM?</div>
                <div class="chip" onclick="askQuick('Apa itu VDM?')">Apa itu VDM?</div>
                <div class="chip" onclick="askQuick('Aturan New Life Rule (NLR)')">Aturan NLR</div>
            </div>

            <div class="chat-input-area">
                <textarea id="userInput" placeholder="Tanyakan seputar rules server... (Tekan Enter untuk kirim)" onkeydown="handleKeyDown(event)"></textarea>
                <button onclick="sendMessage()">Kirim</button>
            </div>
        </div>
    </div>

    <script>
        const ramboingRulesText = `Demi menjaga keseimbangan, keadilan, dan kualitas Roleplay, berikut adalah pembaruan <b>Rules Ramboing</b> yang WAJIB dipatuhi oleh seluruh pemain. ⚖️✨<br><br>
📦 <b>Batas Maksimal Hasil Kerja:</b><br>
📌 Tanpa Tas: Max 200<br>
🎒 Menggunakan Tas: Max 250<br>
<i>Berlaku untuk seluruh hasil pekerjaan seperti 🛢️ Minyak, 🪵 Kayu, ⛏️ Bahan Tambang (🥇 Emas, 🥈 Perak, ⚙️ Besi), 🧵 Hasil Jahit, serta seluruh hasil kerja lainnya.</i><br><br>
🛠️ <b>Batas Maksimal Peralatan:</b><br>
📱 HP : Max 5<br>
🛹 Skate : Max 5<br>
🎨 Pilox : Max 5<br>
🧰 Toolkit : Max 5<br>
⛽ Jerigen : Max 5<br>
🍱 Paket Makanan : Max 10<br>
🍔 Makanan : Max 20<br>
🥤 Minuman : Max 20<br>
🩹 Bandage : Max 10<br><br>
💵 <b>Batas Maksimal Membawa Uang Hijau:</b><br>
💸 Tanpa Koper: Max $100.000 di kantong.<br>
🧳 Menggunakan Aksesoris Koper: Max $1.000.000.<br><br>
⚠️ <b>Sanksi Pelanggaran:</b><br>
🚔 Pemain yang terbukti melanggar Rules Ramboing atau membawa barang maupun uang melebihi batas yang telah ditentukan akan dikenakan sanksi berupa:<br>
🔒 Jail 60 Menit<br>
⚠️ +2 Warning<br><br>
❗ <i>Tidak ada toleransi. Pastikan selalu memeriksa jumlah barang dan uang yang dibawa sebelum melakukan aktivitas Roleplay agar terhindar dari sanksi.</i><br><br>
🙏 Terima kasih atas perhatian dan kerja samanya. Mari bersama-sama menjaga Nexotis Roleplay agar tetap realistis, adil, dan nyaman untuk seluruh pemain.`;

        const serverRules = {
            "ramboing": ramboingRulesText,
            "rambo": ramboingRulesText,
            "tas": ramboingRulesText,
            "peralatan": ramboingRulesText,
            "uang": "<b>Batas Membawa Uang Hijau:</b><br>💸 Tanpa Koper: Max $100.000 di kantong.<br>🧳 Menggunakan Aksesoris Koper: Max $1.000.000.",
            "rdm": "<b>RDM (Random Deathmatch):</b> Membunuh atau menyerang pemain lain tanpa alasan Roleplay (RP) yang jelas dan valid.",
            "vdm": "<b>VDM (Vehicle Deathmatch):</b> Menggunakan kendaraan sebagai senjata untuk menabrak atau membunuh pemain lain tanpa alasan RP.",
            "nlr": "<b>NLR (New Life Rule):</b> Jika karakter Anda pingsan/mati dan di-respawn di Rumah Sakit, Anda lupa akan kejadian sebelum mati dan tidak boleh kembali ke lokasi kejadian dalam kurun waktu tertentu.",
            "metagaming": "<b>MetaGaming (MG):</b> Menggunakan informasi dari luar game (OOC/Discord/Livestream) untuk kepentingan dalam game (IC).",
            "powergaming": "<b>PowerGaming (PG):</b> Melakukan hal-hal yang tidak manusiawi atau tidak masuk akal secara realitas di dalam server RP.",
            "failrp": "<b>Fail RP:</b> Gagal melakukan roleplay sesuai standar atau keluar dari peran karakter secara sengaja.",
            "ooc": "<b>OOC (Out of Character):</b> Pembicaraan atau tindakan di luar karakter RP.",
            "ic": "<b>IC (In Character):</b> Segala hal yang berkaitan langsung dengan karakter dalam game."
        };

        function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();

            if (message === '') return;

            appendMessage(message, 'user-message');
            input.value = '';

            setTimeout(() => {
                const botResponse = getBotResponse(message.toLowerCase());
                appendMessage(botResponse, 'bot-message');
            }, 300);
        }

        function askQuick(text) {
            document.getElementById('userInput').value = text;
            sendMessage();
        }

        function handleKeyDown(e) {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        }

        function appendMessage(text, className) {
            const chatBox = document.getElementById('chatBox');
            const messageDiv = document.createElement('div');
            messageDiv.className = `message ${className}`;
            messageDiv.innerHTML = text;
            chatBox.appendChild(messageDiv);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        function getBotResponse(query) {
            for (let key in serverRules) {
                if (query.includes(key)) {
                    return serverRules[key];
                }
            }
            return "Maaf, saya tidak menemukan aturan spesifik terkait hal tersebut. Silakan baca rules lengkap di Discord resmi GHRP atau tanyakan ke Admin/Staff.";
        }
    </script>
</body>
</html>
