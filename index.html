<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyber Neon Wallpaper - GHIRP</title>
    <style>
        :root {
            --bg-color: #030712;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 20% 30%, rgba(189, 0, 255, 0.15) 0%, transparent 50%),
                radial-gradient(circle at 80% 70%, rgba(0, 243, 255, 0.15) 0%, transparent 50%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Efek Grid Cyber Background */
        body::before {
            content: "";
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: linear-gradient(rgba(0, 243, 255, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 243, 255, 0.03) 1px, transparent 1px);
            background-size: 40px 40px;
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: translateY(0); }
            100% { transform: translateY(40px); }
        }

        /* Container Teks Cyber Berubah Warna */
        .cyber-wallpaper-container {
            position: relative;
            z-index: 2;
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 20px;
            padding: 20px;
        }

        .cyber-text {
            font-size: clamp(28px, 6vw, 64px);
            font-weight: bold;
            letter-spacing: 8px;
            text-transform: uppercase;
            animation: cyberColorShift 5s infinite alternate ease-in-out, textFloat 3s infinite ease-in-out alternate;
        }

        .cyber-text.secondary {
            font-size: clamp(14px, 3vw, 24px);
            letter-spacing: 12px;
            animation: cyberColorShiftReverse 6s infinite alternate ease-in-out, textFloat 4s infinite ease-in-out alternate-reverse;
            opacity: 0.85;
        }

        @keyframes cyberColorShift {
            0% { 
                color: #00f3ff; 
                text-shadow: 0 0 10px #00f3ff, 0 0 20px #00f3ff, 0 0 40px #00f3ff, 0 0 80px #00f3ff; 
            }
            33% { 
                color: #bd00ff; 
                text-shadow: 0 0 10px #bd00ff, 0 0 20px #bd00ff, 0 0 40px #bd00ff, 0 0 80px #bd00ff; 
            }
            66% { 
                color: #ff0055; 
                text-shadow: 0 0 10px #ff0055, 0 0 20px #ff0055, 0 0 40px #ff0055, 0 0 80px #ff0055; 
            }
            100% { 
                color: #00ff66; 
                text-shadow: 0 0 10px #00ff66, 0 0 20px #00ff66, 0 0 40px #00ff66, 0 0 80px #00ff66; 
            }
        }

        @keyframes cyberColorShiftReverse {
            0% { 
                color: #00ff66; 
                text-shadow: 0 0 8px #00ff66, 0 0 16px #00ff66, 0 0 30px #00ff66; 
            }
            33% { 
                color: #ff0055; 
                text-shadow: 0 0 8px #ff0055, 0 0 16px #ff0055, 0 0 30px #ff0055; 
            }
            66% { 
                color: #bd00ff; 
                text-shadow: 0 0 8px #bd00ff, 0 0 16px #bd00ff, 0 0 30px #bd00ff; 
            }
            100% { 
                color: #00f3ff; 
                text-shadow: 0 0 8px #00f3ff, 0 0 16px #00f3ff, 0 0 30px #00f3ff; 
            }
        }

        @keyframes textFloat {
            0% { transform: translateY(0) scale(1); filter: brightness(1); }
            100% { transform: translateY(-8px) scale(1.02); filter: brightness(1.2); }
        }
    </style>
</head>
<body>

    <div class="cyber-wallpaper-container">
        <div class="cyber-text">STUDIO</div>
        <div class="cyber-text secondary">GHIRP CYBERPUNK</div>
    </div>

</body>
</html>
