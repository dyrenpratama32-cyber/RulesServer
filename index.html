<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Assistant - Ngobrol Santai</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .chat-container {
            width: 100%;
            max-width: 400px;
            height: 600px;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .chat-header {
            background-color: #0084ff;
            color: white;
            padding: 15px;
            text-align: center;
            font-weight: bold;
            font-size: 16px;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            max-width: 80%;
            padding: 10px 14px;
            border-radius: 15px;
            font-size: 14px;
            line-height: 1.4;
        }
        .message.ai {
            background-color: #e4e6eb;
            color: #050505;
            align-self: flex-start;
            border-bottom-left-radius: 2px;
        }
        .message.user {
            background-color: #0084ff;
            color: white;
            align-self: flex-end;
            border-bottom-right-radius: 2px;
        }
        .chat-input-area {
            display: flex;
            padding: 10px;
            background: #ffffff;
            border-top: 1px solid #ddd;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px 14px;
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        .chat-input-area button {
            background-color: #0084ff;
            color: white;
            border: none;
            padding: 0 16px;
            margin-left: 8px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
        }
        .chat-input-area button:hover {
            background-color: #006dd9;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">Asisten AI Harian</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message ai">Halo! Aku asisten setiamu. Ada yang bisa aku bantu hari ini, atau mau ngobrol santai?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ketik pesan di sini..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        function appendMessage(sender, text) {
            const chatMessages = document.getElementById('chatMessages');
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message', sender);
            messageDiv.textContent = text;
            chatMessages.appendChild(messageDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function getAIResponse(input) {
            input = input.toLowerCase();

            if (input.includes('halo') || input.includes('hai') || input.includes('pagi') || input.includes('siang') || input.includes('sore') || input.includes('malam')) {
                return "Halo juga! Senang bisa ngobrol sama kamu. Gimana kabar kamu hari ini?";
            } else if (input.includes('sehat') || input.includes('baik') || input.includes('alhamdulillah') || input.includes('luar biasa')) {
                return "Syukurlah kalau kamu sehat dan baik-baik saja! Jaga kesehatan terus ya.";
            } else if (input.includes('kurang sehat') || input.includes('sakit') || input.includes('lelah') || input.includes('capek')) {
                return "Wah, lekas sembuh atau istirahat yang cukup ya! Jangan diporsir, kesehatanmu yang paling utama.";
            } else if (input.includes('terima kasih') || input.includes('makasih')) {
                return "Sama-sama! Kalau butuh teman ngobrol atau bantuan lagi, panggil aku ya.";
            } else if (input.includes('dadah') || input.includes('bye')) {
                return "Dadah! Sampai jumpa lagi, semoga harimu menyenangkan!";
            } else {
                return "Wah, menarik banget! Ceritakan lebih banyak dong, atau tanyakan hal lain kalau ada yang ingin dibahas.";
            }
        }

        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const text = inputField.value.trim();
            if (text === "") return;

            appendMessage('user', text);
            inputField.value = "";

            setTimeout(() => {
                const response = getAIResponse(text);
                appendMessage('ai', response);
            }, 500);
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }
    </script>

</body>
</html>
