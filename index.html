<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Aturan - GTA Style</title>
    <style>
        body {
            background-color: #121212;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px;
        }
        .container {
            max-width: 600px;
            margin: auto;
            background: #1e1e1e;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
        }
        h1 {
            color: #f39c12;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        button {
            background-color: #f39c12;
            color: #121212;
            border: none;
            padding: 12px 25px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            margin-top: 20px;
            transition: 0.2s;
        }
        button:hover {
            background-color: #e67e22;
        }
        #status {
            margin-top: 15px;
            font-size: 14px;
            color: #888;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>San Andreas Rules Server</h1>
        <p>Tekan tombol di bawah untuk memutar melodi synth gangster ala GTA SAMP.</p>
        <button id="playBtn" onclick="toggleMusic()">Putar Musik</button>
        <div id="status">Status: Berhenti</div>
    </div>

    <script>
        let audioCtx = null;
        let isPlaying = false;
        let timerId = null;

        // Nada dasar ala G-Funk / Hip-hop klasik (Frequencies dalam Hz)
        const bassNotes = [110, 110, 123.47, 130.81, 110, 98.00, 87.31, 98.00];
        const synthNotes = [440, 493.88, 523.25, 587.33, 523.25, 493.88, 440, 392.00];
        let step = 0;

        function startMusic() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }

            isPlaying = true;
            document.getElementById('playBtn').innerText = 'Matikan Musik';
            document.getElementById('status').innerText = 'Status: Memutar Musik Gangsta...';

            // Tempo ketukan (BPM ala santai)
            timerId = setInterval(() => {
                playGangstaBeat(audioCtx, bassNotes[step % bassNotes.length], synthNotes[step % synthNotes.length]);
                step++;
            }, 300);
        }

        function stopMusic() {
            isPlaying = false;
            clearInterval(timerId);
            document.getElementById('playBtn').innerText = 'Putar Musik';
            document.getElementById('status').innerText = 'Status: Berhenti';
        }

        function toggleMusic() {
            if (isPlaying) {
                stopMusic();
            } else {
                startMusic();
            }
        }

        function playGangstaBeat(ctx, bassFreq, synthFreq) {
            let now = ctx.currentTime;

            // 1. Suara Bass Tebal (Sub-Bass)
            let oscBass = ctx.createOscillator();
            let gainBass = ctx.createGain();
            
            oscBass.type = 'sawtooth';
            oscBass.frequency.setValueAtTime(bassFreq / 2, now);

            // Filter agar suara bass lebih "mendem" khas pantai barat
            let filter = ctx.createBiquadFilter();
            filter.type = 'lowpass';
            filter.frequency.setValueAtTime(300, now);

            gainBass.gain.setValueAtTime(0.5, now);
            gainBass.gain.exponentialRampToValueAtTime(0.01, now + 0.25);

            oscBass.connect(filter);
            filter.connect(gainBass);
            gainBass.connect(ctx.destination);

            oscBass.start(now);
            oscBass.stop(now + 0.25);

            // 2. Suara Lead Synth Portamento Tinggi (High Pitch G-Funk Whistle)
            if (step % 2 === 0) {
                let oscLead = ctx.createOscillator();
                let gainLead = ctx.createGain();

                oscLead.type = 'sine';
                oscLead.frequency.setValueAtTime(synthFreq, now);
                oscLead.frequency.exponentialRampToValueAtTime(synthFreq * 1.5, now + 0.2);

                gainLead.gain.setValueAtTime(0.15, now);
                gainLead.gain.exponentialRampToValueAtTime(0.001, now + 0.25);

                oscLead.connect(gainLead);
                gainLead.connect(ctx.destination);

                oscLead.start(now);
                oscLead.stop(now + 0.25);
            }
        }
    </script>
</body>
</html>
