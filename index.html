<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rules Kota - AI Assistant</title>
    <style>
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .chat-container {
            width: 100%;
            max-width: 500px;
            background: #1e293b;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 1px solid #334155;
        }
        .chat-header {
            background: #0284c7;
            color: white;
            padding: 15px;
            font-weight: bold;
            text-align: center;
            font-size: 16px;
            letter-spacing: 1px;
        }
        .chat-messages {
            height: 350px;
            overflow-y: auto;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }
        .message {
            padding: 10px 14px;
            border-radius: 8px;
            max-width: 80%;
            font-size: 14px;
            line-height: 1.4;
        }
        .bot-message {
            background: #334155;
            color: #f1f5f9;
            align-self: flex-start;
            border-left: 4px solid #38bdf8;
        }
        .user-message {
            background: #0284c7;
            color: white;
            align-self: flex-end;
        }
        .chat-input-area {
            display: flex;
            padding: 12px;
            background: #0f172a;
            border-top: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            padding: 10px;
            border: 1px solid #475569;
            background: #1e293b;
            color: white;
            border-radius: 6px;
            outline: none;
            font-size: 14px;
        }
        input[type="text"]:focus {
            border-color: #38bdf8;
        }
        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            margin-left: 8px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
    </style>
</head>
<body>

    <div class="chat-container">
        <div class="chat-header">BOT RULES KOTA ROLEPLAY</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">Halo warga baru! Silakan tanyakan apa saja seputar rules atau peraturan kota kita di sini (Contoh: "Apa itu DM?", "Berapa minimal rob?").</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ketik pertanyaan rules..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Kirim</button>
        </div>
    </div>

    <script>
        function sendMessage() {
            const inputField = document.getElementById('userInput');
            const chatMessages = document.getElementById('chatMessages');
            const text = inputField.value.trim();

            if (text === '') return;

            // Tampilkan pesan user
            const userMsgDiv = document.createElement('div');
            userMsgDiv.className = 'message user-message';
            userMsgDiv.textContent = text;
            chatMessages.appendChild(userMsgDiv);

            inputField.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Respon otomatis bot berdasarkan kata kunci rules
            setTimeout(() => {
                const botMsgDiv = document.createElement('div');
                botMsgDiv.className = 'message bot-message';
                botMsgDiv.textContent = getBotResponse(text.toLowerCase());
                chatMessages.appendChild(botMsgDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;
            }, 400);
        }

        function getBotResponse(query) {
            // Ubah atau tambah aturan kota Anda di bagian ini
            if (query.includes('dm') || query.includes('deathmatch') || query.includes('menyerang')) {
                return "Aturan DM (Deathmatch): Dilarang keras menyerang atau membunuh player lain tanpa alasan IC (In-Character) atau alasan roleplay yang jelas!";
            } else if (query.includes('rob') || query.includes('perampokan') || query.includes('geng')) {
                return "Aturan Rob/Geng: Minimal anggota geng yang aktif melakukan aksi perampokan adalah 3 orang. Dilarang merampok di area safezone!";
            } else if (query.includes('safezone') || query.includes('bank') || query.includes('rs') || query.includes('hospital')) {
                return "Aturan Safezone: Area Bank, Rumah Sakit, dan Kantor Polisi adalah Safezone. Segala bentuk tindakan kriminal dilarang di area ini.";
            } else if (query.includes('pg') || query.includes('powergaming')) {
                return "Aturan Powergaming (PG): Dilarang melakukan hal yang tidak masuk akal di dunia nyata (Contoh: mengangkat mobil sendirian, lari sambil bawa senjata berat tanpa pertimbangan).";
            } else if (query.includes('mg') || query.includes('metagaming')) {
                return "Aturan Metagaming (MG): Dilarang menggunakan informasi OOC (Out of Character) seperti lewat Discord/VC untuk kepentingan IC game.";
            } else {
                return "Waduh, saya kurang paham pertanyaan itu. Coba tanyakan hal lain seputar rules kota atau langsung hubungi Admin yang bertugas ya!";
            }
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') {
                sendMessage();
            }
        }
    </script>
</body>
</html>
